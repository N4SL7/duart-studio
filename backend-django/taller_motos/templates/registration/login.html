{% extends "taller_motos/base.html" %}
{% block titulo %}Ingresar - DUART-STUDIO{% endblock %}

{% block contenido %}
<section class="seccion">
  <h2>Iniciar sesión</h2>
  <p class="centrado">Consulta el proceso de tu moto o administra el taller.</p>

  <form class="formulario" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn" type="submit">Ingresar</button>
    <p class="centrado">¿No tienes cuenta? <a href="{% url 'taller_motos:registro' %}">Regístrate aquí</a></p>
  </form>
</section>
{% endblock %}
